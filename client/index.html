<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Based Assignment Validation 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Global fail-safe: catch any script load failures or early runtime errors
      window.addEventListener('error', function(e) {
        console.error('System error caught by safety handler:', e);
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:sans-serif;padding:24px;text-align:center;">' +
              '<div style="max-width:440px;background:#ffffff;padding:36px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,0.06);border:1px solid #e2e8f0;">' +
                '<div style="font-size:36px;margin-bottom:12px;">✨</div>' +
                '<h2 style="font-size:20px;font-weight:800;color:#0f172a;margin:0 0 8px;">AI Code Validator 2.0</h2>' +
                '<p style="font-size:12px;color:#64748b;margin:0 0 24px;line-height:1.6;">A browser session synchronization issue was detected. Click below to refresh your portal.</p>' +
                '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="background:#4f46e5;color:#ffffff;border:none;padding:12px 24px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,0.25);">Reset Session & Open Portal</button>' +
              '</div></div>';
          }
        }, 500);
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
